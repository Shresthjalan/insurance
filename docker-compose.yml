version: '3.9'

# PostgreSQL is hosted on Supabase — only local dev services needed here

services:
  redis:
    image: redis:7-alpine
    container_name: insurance_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
